<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — AVEN</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="/index.html" class="brand">AVEN</a>
    <p class="sub">Welcome back. Your shelf missed you.</p>

    <div class="form-error" id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>

    <div class="auth-switch">New to AVEN? <a href="/register.html">Create an account</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  redirectIfLoggedIn();

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('form-error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      setSession(data.token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
